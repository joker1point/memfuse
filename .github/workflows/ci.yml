name: ci

# push 到 main（含 PR）自动跑：PowerShell 语法解析 → 只读接口自测 → README 素材规范 → 对外材料红线。
#
# 测试套件（tests/*.ps1，11 项）多为**杀伤类**（受控沙包 + 全量白名单隔离 + 断言降级/还原/无击杀），
# 只在本机跑；runner 上只跑无沙包、纯只读的 tests/json-interface.ps1。
# 发版侧的 CRLF / BOM 资产闸门由 release.yml 承担。
#
# 2026-10-17：README 补齐 3 张真机截图（功能点 9 → 需 3 张），素材规范这一步从"先报告"
# 转成硬闸门 —— 以后改 README 掉回 0 张会直接红。

on:
  push:
    branches: [main]
  pull_request:

# Windows runner 默认 stdout 不是 UTF-8；校验脚本会打印中文，不设会 UnicodeEncodeError
# （2026-10-16 首跑实测；脚本侧也加了 reconfigure 兜底，这里按项目既有约定再设一道）。
env:
  PYTHONIOENCODING: utf-8

jobs:
  checks:
    name: "语法 · 素材规范 · 红线"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: "PowerShell 语法解析（全部 .ps1，含 tests/）"
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              $bad++
              Write-Host "::error file=$($_.Name)::$($errs.Count) 个语法错误"
              $errs | ForEach-Object { Write-Host "    $($_.Message)" }
            }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "全部 .ps1 语法解析通过"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: "只读接口自测（-Json / -AgentGuide）"
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/json-interface.ps1

      - name: "README 素材规范（数量按功能点数 / 形式按复杂度）"
        run: python tools/check_readme_shots.py .

      - name: "对外材料红线（品牌词 / 凭据）"
        run: python tools/check_public_materials.py
